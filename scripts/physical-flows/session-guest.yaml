appId: ${APP_ID}
name: SecureStore - reinicio tras logout mantiene invitado
---
- extendedWaitUntil:
    visible: '.*(bienestar|explorar|CEMYDI).*'
    timeout: 120000
- runFlow:
    when:
      visible: Omitir introducción y explorar catálogo
    commands:
      - tapOn: Omitir introducción y explorar catálogo
- extendedWaitUntil:
    visible: Para tu bienestar
    timeout: 120000
- tapOn: Perfil
- extendedWaitUntil:
    visible: Iniciar sesión
    timeout: 15000
- assertNotVisible: Cliente CEMYDI
- back
- takeScreenshot: session-reinicio-invitado
