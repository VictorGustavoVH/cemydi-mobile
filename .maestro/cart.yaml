appId: host.exp.exponent
name: Carrito de muestra - cantidad, eliminación y deshacer
---
- runFlow: support/open-catalog.yaml
- tapOn: Buscar equipo ortopédico
- inputText: silla
- hideKeyboard
- scrollUntilVisible:
    element:
      text: Silla de ruedas.*Ver producto.*
    direction: DOWN
- tapOn: Silla de ruedas.*Ver producto.*
- extendedWaitUntil:
    visible: Añadir al carrito
    timeout: 10000
- tapOn: Añadir al carrito
- tapOn: Ver carrito.*
- extendedWaitUntil:
    visible: Mi carrito
    timeout: 10000
- assertVisible: 'Cantidad de Silla de ruedas, compra: 1'
- tapOn: Aumentar cantidad de Silla de ruedas, compra
- assertVisible: 'Cantidad de Silla de ruedas, compra: 2'
- tapOn: Eliminar Silla de ruedas, compra
- assertVisible: Tu carrito está vacío
- tapOn: Deshacer
- assertVisible: 'Cantidad de Silla de ruedas, compra: 2'
