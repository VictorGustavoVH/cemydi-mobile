appId: ${APP_ID}
name: Pestañas conservan búsqueda y evitan pantallas duplicadas
---
- runFlow: support/open-catalog.yaml
- tapOn: Explorar
- tapOn: Buscar equipo ortopédico
- inputText: Equipo E2E 1
- hideKeyboard
- extendedWaitUntil:
    visible: Equipo E2E 1
    timeout: 30000
- tapOn: Inicio
- tapOn: Explorar
- assertVisible: Equipo E2E 1
- repeat:
    times: 3
    commands:
      - tapOn: Carrito
      - assertVisible: Tu carrito está vacío
      - tapOn: Inicio
      - assertVisible: Para tu bienestar
- tapOn: Perfil
- extendedWaitUntil:
    visible: Correo electrónico
    timeout: 15000
- back
- assertVisible: Para tu bienestar
