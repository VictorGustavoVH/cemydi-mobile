appId: host.exp.exponent
name: Detalle de muestra - favoritos y modalidades
---
- runFlow: support/open-preview-product.yaml
- extendedWaitUntil:
    visible: Guardar en favoritos
    timeout: 10000
- tapOn: Guardar en favoritos
- assertVisible: Quitar de favoritos
- scrollUntilVisible:
    element:
      text: Renta
    direction: DOWN
- tapOn: Renta
- assertVisible: Añadir renta al carrito
- scrollUntilVisible:
    element:
      text: Características
    direction: DOWN
- tapOn: Características
- scrollUntilVisible:
    element:
      text: Reposabrazos y reposapiés
    direction: DOWN
- assertVisible: Reposabrazos y reposapiés
