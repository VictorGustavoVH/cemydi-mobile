appId: host.exp.exponent
name: Detalle de muestra - favoritos y modalidades
---
- runFlow: support/open-catalog.yaml
- tapOn: Buscar equipo ortopédico
- inputText: silla
- hideKeyboard
- scrollUntilVisible:
    element:
      text: Silla de ruedas.*Ver producto.*
    direction: DOWN
- tapOn: Silla de ruedas.*Ver producto.*
- extendedWaitUntil:
    visible: Guardar en favoritos
    timeout: 10000
- tapOn: Guardar en favoritos
- assertVisible: Quitar de favoritos
- scrollUntilVisible:
    element:
      text: Renta
    direction: DOWN
- tapOn: Renta
- assertVisible: Añadir renta al carrito
- scrollUntilVisible:
    element:
      text: Características
    direction: DOWN
- tapOn: Características
- scrollUntilVisible:
    element:
      text: Reposabrazos y reposapiés
    direction: DOWN
- assertVisible: Reposabrazos y reposapiés
