name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  EXPO_NO_DOTENV: '1'
  EXPO_NO_TELEMETRY: '1'

defaults:
  run:
    shell: bash

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Expo Doctor
        run: npm run doctor
      - name: Validate Maestro flows and infrastructure
        run: |
          npm run test:e2e -- --check
          node --test scripts/maestro-infra.test.cjs scripts/maestro-ci.test.cjs

  tests:
    name: ${{ matrix.suite }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        suite: [unit, integration]
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        id: run-tests
        run: npm run test:${{ matrix.suite }} -- --ci
      - name: Summarize test results
        if: always()
        run: node scripts/test-summary.cjs ${{ matrix.suite }} ${{ steps.run-tests.outcome }}
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: jest-${{ matrix.suite }}-${{ github.run_attempt }}
          path: test-results/jest/${{ matrix.suite }}/
          retention-days: 14
          if-no-files-found: warn

  build_android:
    needs: [validate, tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_APP_ENV: development
      EXPO_PUBLIC_API_URL: http://127.0.0.1:4198
      EXPO_PUBLIC_WEBSITE_URL: http://127.0.0.1:4198
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Setup Java
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4.0.4
      - name: Install native build tools
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.1.12297006' 'cmake;3.30.5'
      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v6.4.0
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Install dependencies
        run: npm ci
      - name: Generate Android project with CNG
        run: |
          mkdir -p test-results/android
          npx expo prebuild --platform android --no-install 2>&1 | tee test-results/android/prebuild.log
      - name: Build development APK for x86_64
        run: |
          chmod +x android/gradlew
          ./android/gradlew -p android :app:assembleDebug -PreactNativeArchitectures=x86_64 --no-daemon --max-workers=2 '-Dorg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g' --stacktrace 2>&1 | tee test-results/android/build.log
      - name: Prepare APK artifact
        run: |
          mkdir -p test-results/apk
          cp android/app/build/outputs/apk/debug/app-debug.apk test-results/apk/
          cd test-results/apk
          sha256sum app-debug.apk > app-debug.apk.sha256
      - name: Upload development APK
        uses: actions/upload-artifact@v7.0.2
        with:
          # Stable within this run so rerunning only Maestro can reuse the APK.
          name: android-development-${{ github.sha }}
          path: test-results/apk/
          retention-days: 7
          if-no-files-found: error
          overwrite: true
      - name: Upload Android build diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: android-build-${{ github.run_attempt }}
          path: |
            test-results/android/
            android/build/reports/
            android/app/build/reports/
          retention-days: 14
          if-no-files-found: warn

  maestro:
    needs: [build_android]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CEMYDI_MAESTRO_HOME: ${{ github.workspace }}/.tools/maestro/maestro
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Setup Java
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm ci
      - name: Download development APK from this run
        uses: actions/download-artifact@v8.0.2
        with:
          name: android-development-${{ github.sha }}
          path: test-results/apk
      - name: Verify APK checksum
        working-directory: test-results/apk
        run: sha256sum --check app-debug.apk.sha256
      - name: Install Maestro 2.11.0
        run: |
          mkdir -p .tools/maestro
          curl --fail --location --silent --show-error https://github.com/mobile-dev-inc/Maestro/releases/download/cli-2.11.0/maestro.zip -o .tools/maestro.zip
          echo '5384593cb4e7a106489e75a821d157dd43f4e438df6bc308b72e82c685e1283a  .tools/maestro.zip' | sha256sum --check
          unzip -q .tools/maestro.zip -d .tools/maestro
          npm run maestro -- --version
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Run Maestro on a disposable Android emulator
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          avd-name: cemydi-ci
          emulator-port: 5554
          force-avd-creation: true
          disable-animations: true
          disable-spellchecker: true
          disable-linux-hw-accel: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash scripts/maestro-ci.sh
      - name: Upload Maestro evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: maestro-android-${{ github.run_attempt }}
          path: test-results/maestro/
          retention-days: 14
          if-no-files-found: warn

  ci:
    name: ci
    if: always()
    needs: [validate, tests, build_android, maestro]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      JOB_RESULTS: ${{ toJSON(needs) }}
    steps:
      - name: Require every stage to succeed
        run: |
          node -e 'const jobs = Object.entries(JSON.parse(process.env.JOB_RESULTS)); for (const [name, job] of jobs) console.log(`${name}: ${job.result}`); if (jobs.some(([, job]) => job.result !== "success")) process.exit(1);'
