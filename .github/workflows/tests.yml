name: Tests

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: ${{ matrix.suite }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        suite: [unit, integration]
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        id: run-tests
        run: npm run test:${{ matrix.suite }} -- --ci
      - name: Summarize test results
        if: always()
        run: node scripts/test-summary.cjs ${{ matrix.suite }} ${{ steps.run-tests.outcome }}
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: jest-${{ matrix.suite }}-${{ github.run_attempt }}
          path: test-results/jest/${{ matrix.suite }}/
          retention-days: 14
          if-no-files-found: warn
