name: Tests

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
    branches:
      - develop
      - main
      - 'seguridad/**'
      - 'mejora/**'
      - 'correccion/**'
      - 'funcionalidad/**'
      - 'publicacion/**'
  push:
    branches:
      - develop
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  EXPO_NO_DOTENV: '1'
  EXPO_NO_TELEMETRY: '1'

defaults:
  run:
    shell: bash

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      android_required: ${{ steps.select.outputs.android_required }}
    steps:
      - name: Checkout tested revision and history
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Select Android validation
        id: select
        run: node scripts/ci/android-policy.cjs select
      - name: Upload selection evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: android-selection-${{ github.sha }}-${{ github.run_attempt }}
          path: test-results/ci/
          retention-days: 14
          if-no-files-found: warn

  tests:
    name: ${{ matrix.suite }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        suite: [unit, integration]
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        id: run-tests
        run: npm run test:${{ matrix.suite }} -- --ci
      - name: Summarize test results
        if: always()
        run: node scripts/test-summary.cjs ${{ matrix.suite }} ${{ steps.run-tests.outcome }}
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: jest-${{ matrix.suite }}-${{ github.run_attempt }}
          path: test-results/jest/${{ matrix.suite }}/
          retention-days: 14
          if-no-files-found: warn

  maestro_checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate Maestro flows and infrastructure
        run: |
          npm run test:e2e -- --check
          node --test scripts/maestro-infra.test.cjs scripts/maestro-ci.test.cjs scripts/ci/android-policy.test.cjs scripts/ci/prepare-kvm.test.cjs scripts/ci/screens-lifetime.test.cjs

  build_android:
    needs: [changes, tests, maestro_checks]
    if: needs.changes.outputs.android_required == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_APP_ENV: development
      EXPO_PUBLIC_API_URL: http://127.0.0.1:4198
      EXPO_PUBLIC_WEBSITE_URL: http://127.0.0.1:4198
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Setup Java
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4.0.4
      - name: Install native build tools
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.1.12297006' 'cmake;3.30.5' 'cmake;3.22.1'
      - name: Install dependencies
        run: npm ci
      - name: Generate Android project with CNG
        run: |
          mkdir -p test-results/android
          npx expo prebuild --platform android --no-install 2>&1 | tee test-results/android/prebuild.log
      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v6.4.0
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Provision Gradle wrapper distribution
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DIST_DIR="$HOME/.gradle/wrapper/dists/gradle-9.3.1-bin/23ovyewtku6u96viwx3xl3oks"
          mkdir -p "$DIST_DIR"
          if [ ! -f "$DIST_DIR/gradle-9.3.1-bin.zip.ok" ]; then
            echo "Provisioning Gradle 9.3.1 distribution..."
            if [ ! -f "$DIST_DIR/gradle-9.3.1-bin.zip" ]; then
              gh release download v9.3.1 --repo gradle/gradle-distributions --pattern "gradle-9.3.1-bin.zip" --dir "$DIST_DIR" || \
              curl -fL --retry 3 --retry-delay 3 -o "$DIST_DIR/gradle-9.3.1-bin.zip" "https://services.gradle.org/distributions/gradle-9.3.1-bin.zip"
            fi
            if [ -f "$DIST_DIR/gradle-9.3.1-bin.zip" ]; then
              echo "Extracting Gradle 9.3.1..."
              unzip -q -o "$DIST_DIR/gradle-9.3.1-bin.zip" -d "$DIST_DIR"
              touch "$DIST_DIR/gradle-9.3.1-bin.zip.ok"
              echo "Gradle 9.3.1 provisioned successfully."
            else
              echo "Warning: Gradle zip could not be provisioned in advance; wrapper will attempt direct download."
            fi
          fi
      - name: Build development APK for x86_64
        run: |
          chmod +x android/gradlew
          for attempt in 1 2 3; do
            echo "Gradle build attempt $attempt of 3..."
            ./android/gradlew -p android :app:assembleDebug -PreactNativeArchitectures=x86_64 --no-daemon --max-workers=2 '-Dorg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g' --stacktrace 2>&1 | tee test-results/android/build.log && break || {
              if [ "$attempt" -eq 3 ]; then
                echo "All Gradle build attempts failed."
                exit 1
              fi
              echo "Gradle build attempt $attempt failed; retrying in 10s..."
              sleep 10
            }
          done
      - name: Prepare APK artifact
        run: |
          mkdir -p test-results/apk
          cp android/app/build/outputs/apk/debug/app-debug.apk test-results/apk/
          cd test-results/apk
          sha256sum app-debug.apk > app-debug.apk.sha256
      - name: Upload development APK
        uses: actions/upload-artifact@v7.0.2
        with:
          name: android-development-${{ github.sha }}
          path: test-results/apk/
          retention-days: 7
          if-no-files-found: error
          overwrite: true
      - name: Upload Android build diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: android-build-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            test-results/android/
            android/build/reports/
            android/app/build/reports/
          retention-days: 14
          if-no-files-found: warn
